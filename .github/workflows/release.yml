name: Release Android APK

# Push a tag like v1.0.0 to build the APK and publish it on the repository's Releases page.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "cartzy-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: cartzy-${{ github.ref_name }}.apk
          body: |
            Cartzy shopping app for Android.

            Install: download the APK on your phone and open it (allow installing from this source when asked).
            Demo login: demo@cartzy.app / demo1234

            Web version: https://raj02priyesh.github.io/cartzy-shop-app/
